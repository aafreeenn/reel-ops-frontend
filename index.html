<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reel Technical Operation</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app"></div>
    <!-- Save Confirmation Modal -->
<div id="saveModal" class="modal" style="display: none;">
    <div class="modal-content">
        <h2>Save Operations?</h2>
        <p>Are you sure you want to save the current operations?</p>

        <div class="modal-actions">
            <button id="confirmSaveBtn" class="modal-btn confirm-btn">Yes, Save</button>
            <button id="cancelSaveBtn" class="modal-btn cancel-btn">Cancel</button>
        </div>
    </div>
</div>

    
    <!-- Load JavaScript modules -->
    <script src="js/config.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
